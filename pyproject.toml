[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-tilelang"
version = "0.1.0.dev0"
description = "A torch.compile backend powered by TileLang, initially supporting Ascend"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch", "tilelang"]

[project.urls]
Repository = "https://github.com/easy-tilelang/torch-tilelang"
Issues = "https://github.com/easy-tilelang/torch-tilelang/issues"
Documentation = "https://github.com/easy-tilelang/torch-tilelang/blob/main/docs/ascend.md"

[project.optional-dependencies]
test = ["pytest>=8", "ruff"]

[project.entry-points."torch_dynamo_backends"]
tilelang = "torch_tilelang.backend:tilelang_backend"
torch_tilelang_ascend = "torch_tilelang.backend:tilelang_backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pto: requires the PTO codegen or execution backend",
    "ascend: requires Ascend runtime support",
]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
